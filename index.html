<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Webpage</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Carousel Section -->
    <section class="carousel-section container my-4">
        <div id="mainCarousel" class="carousel slide shadow-sm rounded overflow-hidden" data-bs-ride="carousel">
            <!-- Carousel Indicators -->
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
                <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
            </div>

            <!-- Carousel Images -->
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="image1.jpg" class="d-block w-100 carousel-img" alt="Image 1">
                </div>
                <div class="carousel-item">
                    <img src="image2.jpg" class="d-block w-100 carousel-img" alt="Image 2">
                </div>
                <div class="carousel-item">
                    <img src="image3.jpg" class="d-block w-100 carousel-img" alt="Image 3">
                </div>
            </div>

            <!-- Previous Button -->
            <button class="carousel-control-prev" type="button" data-bs-target="#mainCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <!-- Next Button -->
            <button class="carousel-control-next" type="button" data-bs-target="#mainCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    </section>

    <!-- YouTube Videos Section -->
    <section class="videos-section container my-5">
        <h2 class="section-title text-center mb-4 fw-bold">Featured Videos</h2>
        <div class="row g-4">

            <!-- Video 1 -->
            <div class="col-md-4">
                <div class="card video-card h-100 shadow-sm border-0">
                    <img src="https://img.youtube.com/vi/5ErAi14u-bE/maxresdefault.jpg" class="card-img-top" alt="Ordinary">
                    <div class="card-body text-center d-flex flex-column">
                        <h5 class="card-title">Ordinary</h5>
                        <a href="https://www.youtube.com/watch?v=5ErAi14u-bE" target="_blank" class="btn btn-primary mt-auto">Watch Now</a>
                    </div>
                </div>
            </div>

            <!-- Video 2 -->
            <div class="col-md-4">
                <div class="card video-card h-100 shadow-sm border-0">
                    <img src="https://img.youtube.com/vi/h2p9rPWef_o/maxresdefault.jpg" class="card-img-top" alt="Harkirat">
                    <div class="card-body text-center d-flex flex-column">
                        <h5 class="card-title">Harkirat</h5>
                        <a href="https://www.youtube.com/watch?v=h2p9rPWef_o" target="_blank" class="btn btn-primary mt-auto">Watch Now</a>
                    </div>
                </div>
            </div>

            <!-- Video 3 -->
            <div class="col-md-4">
                <div class="card video-card h-100 shadow-sm border-0">
                    <img src="https://img.youtube.com/vi/m9nM4Ekdfc8/maxresdefault.jpg" class="card-img-top" alt="Young Sheldon">
                    <div class="card-body text-center d-flex flex-column">
                        <h5 class="card-title">Young Sheldon</h5>
                        <a href="https://www.youtube.com/watch?v=m9nM4Ekdfc8" target="_blank" class="btn btn-primary mt-auto">Watch Now</a>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <!-- Footer -->
    <footer class="footer bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0">&copy; 2026 Samriddh. All Rights Reserved.</p>
    </footer>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
